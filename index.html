<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a2e28;
      --ink-soft: #3d524a;
      --paper: #f3f6f2;
      --paper-deep: #e4ebe6;
      --grid-line: #1a2e28;
      --accent: #0d7a5f;
      --accent-hover: #0a614b;
      --conflict: #c43c3c;
      --conflict-bg: rgba(196, 60, 60, 0.12);
      --selected: rgba(13, 122, 95, 0.14);
      --related: rgba(13, 122, 95, 0.06);
      --given: #1a2e28;
      --user: #0d7a5f;
      --solved: #0d7a5f;
      --shadow: 0 24px 48px rgba(26, 46, 40, 0.12);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, rgba(13, 122, 95, 0.12), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(26, 46, 40, 0.08), transparent 45%),
        linear-gradient(160deg, #eef3ef 0%, #dfe8e2 45%, #e8efe9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
    }

    .app {
      width: min(100%, 440px);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      animation: rise 0.55s ease-out both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(2.4rem, 8vw, 3.2rem);
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--ink);
    }

    .tagline {
      margin-top: 0.4rem;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
    }

    .difficulty {
      display: flex;
      gap: 0.25rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(26, 46, 40, 0.1);
      border-radius: 999px;
      padding: 0.2rem;
    }

    .difficulty button {
      font: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .difficulty button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .difficulty button:hover:not([aria-pressed="true"]) {
      color: var(--ink);
    }

    .board-wrap {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(26, 46, 40, 0.1);
      border-radius: var(--radius);
      padding: 0.85rem;
      box-shadow: var(--shadow);
      position: relative;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 0;
      aspect-ratio: 1;
      width: 100%;
      border: 2.5px solid var(--grid-line);
      background: var(--paper);
      user-select: none;
      transition: box-shadow 0.4s, border-color 0.4s;
    }

    .board.solved {
      border-color: var(--solved);
      box-shadow: 0 0 0 3px rgba(13, 122, 95, 0.25);
      animation: solvedPulse 0.6s ease;
    }

    @keyframes solvedPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Fraunces", serif;
      font-size: clamp(1.1rem, 4.5vw, 1.55rem);
      font-weight: 500;
      background: transparent;
      border: none;
      border-right: 1px solid rgba(26, 46, 40, 0.18);
      border-bottom: 1px solid rgba(26, 46, 40, 0.18);
      color: var(--user);
      cursor: pointer;
      outline: none;
      transition: background 0.15s;
      min-width: 0;
      min-height: 0;
      aspect-ratio: 1;
      -webkit-tap-highlight-color: transparent;
    }

    .cell:nth-child(9n) { border-right: none; }
    .cell:nth-child(n+73) { border-bottom: none; }
    .cell:nth-child(3n):not(:nth-child(9n)) {
      border-right: 2px solid var(--grid-line);
    }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 2px solid var(--grid-line);
    }

    .cell.given {
      color: var(--given);
      font-weight: 700;
      cursor: default;
    }

    .cell.selected {
      background: var(--selected);
    }

    .cell.related:not(.selected) {
      background: var(--related);
    }

    .cell.conflict {
      color: var(--conflict);
      background: var(--conflict-bg);
    }

    .cell.conflict.selected {
      background: rgba(196, 60, 60, 0.2);
    }

    .cell.same-value:not(.selected):not(.conflict) {
      background: rgba(13, 122, 95, 0.1);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr) auto;
      gap: 0.4rem;
    }

    .numpad {
      display: contents;
    }

    .num-btn,
    .clear-btn,
    .action-btn {
      font: inherit;
      font-weight: 600;
      border: 1px solid rgba(26, 46, 40, 0.12);
      background: rgba(255, 255, 255, 0.7);
      color: var(--ink);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
      min-height: 2.75rem;
    }

    .num-btn {
      font-family: "Fraunces", serif;
      font-size: 1.2rem;
      font-weight: 500;
    }

    .num-btn:hover,
    .clear-btn:hover,
    .action-btn:hover {
      background: #fff;
      border-color: rgba(26, 46, 40, 0.25);
    }

    .num-btn:active,
    .clear-btn:active,
    .action-btn:active {
      transform: scale(0.96);
    }

    .clear-btn {
      padding: 0 0.9rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .footer-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.75rem 1rem;
    }

    .action-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    .action-btn.primary:hover {
      background: var(--accent-hover);
      border-color: transparent;
    }

    .status {
      text-align: center;
      min-height: 1.4rem;
      font-size: 0.9rem;
      color: var(--ink-soft);
      transition: color 0.25s, opacity 0.25s;
    }

    .status.win {
      color: var(--solved);
      font-weight: 600;
      animation: fadeIn 0.4s ease;
    }

    .status.warn {
      color: var(--conflict);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-soft);
      opacity: 0.75;
    }

    @media (max-width: 400px) {
      .actions {
        grid-template-columns: repeat(5, 1fr);
      }
      .clear-btn {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1 class="brand">Sudoku</h1>
      <p class="tagline">Fill the grid. One of each digit per row, column, and box.</p>
    </header>

    <div class="toolbar">
      <div class="difficulty" role="group" aria-label="Difficulty">
        <button type="button" data-diff="easy" aria-pressed="false">Easy</button>
        <button type="button" data-diff="medium" aria-pressed="true">Medium</button>
        <button type="button" data-diff="hard" aria-pressed="false">Hard</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku board"></div>
    </div>

    <p class="status" id="status" aria-live="polite"></p>

    <div class="actions">
      <div class="numpad" id="numpad"></div>
      <button type="button" class="clear-btn" id="clearBtn" title="Clear selected cell (Backspace)">Clear</button>
    </div>

    <div class="footer-actions">
      <button type="button" class="action-btn" id="restartBtn">Restart</button>
      <button type="button" class="action-btn primary" id="newBtn">New puzzle</button>
    </div>

    <p class="hint">Click a cell, then use 1–9, the pad, or arrow keys. Delete / Backspace clears.</p>
  </div>

  <script>
    (() => {
      const SIZE = 9;
      const BOX = 3;
      const DIFFICULTY = {
        easy: 38,
        medium: 48,
        hard: 56,
      };

      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const numpadEl = document.getElementById("numpad");
      const clearBtn = document.getElementById("clearBtn");
      const restartBtn = document.getElementById("restartBtn");
      const newBtn = document.getElementById("newBtn");
      const difficultyBtns = document.querySelectorAll(".difficulty button");

      let solution = [];
      let puzzle = [];
      let grid = [];
      let selected = null;
      let difficulty = "medium";
      let solved = false;
      let cellEls = [];

      function emptyGrid() {
        return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      }

      function cloneGrid(g) {
        return g.map((row) => row.slice());
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function isValidPlacement(board, row, col, num) {
        for (let i = 0; i < SIZE; i++) {
          if (board[row][i] === num || board[i][col] === num) return false;
        }
        const br = Math.floor(row / BOX) * BOX;
        const bc = Math.floor(col / BOX) * BOX;
        for (let r = br; r < br + BOX; r++) {
          for (let c = bc; c < bc + BOX; c++) {
            if (board[r][c] === num) return false;
          }
        }
        return true;
      }

      function findEmpty(board) {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] === 0) return [r, c];
          }
        }
        return null;
      }

      function solveBoard(board) {
        const empty = findEmpty(board);
        if (!empty) return true;
        const [row, col] = empty;
        for (const num of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
          if (isValidPlacement(board, row, col, num)) {
            board[row][col] = num;
            if (solveBoard(board)) return true;
            board[row][col] = 0;
          }
        }
        return false;
      }

      function countSolutions(board, limit = 2) {
        let count = 0;
        function dfs(b) {
          if (count >= limit) return;
          const empty = findEmpty(b);
          if (!empty) {
            count++;
            return;
          }
          const [row, col] = empty;
          for (let num = 1; num <= 9; num++) {
            if (isValidPlacement(b, row, col, num)) {
              b[row][col] = num;
              dfs(b);
              b[row][col] = 0;
              if (count >= limit) return;
            }
          }
        }
        dfs(cloneGrid(board));
        return count;
      }

      function generatePuzzle(diff) {
        const full = emptyGrid();
        solveBoard(full);
        const sol = cloneGrid(full);
        const puz = cloneGrid(full);

        const cells = shuffle(
          Array.from({ length: SIZE * SIZE }, (_, i) => [Math.floor(i / SIZE), i % SIZE])
        );

        let removed = 0;
        const target = DIFFICULTY[diff] || DIFFICULTY.medium;

        for (const [r, c] of cells) {
          if (removed >= target) break;
          const backup = puz[r][c];
          puz[r][c] = 0;
          if (countSolutions(puz, 2) !== 1) {
            puz[r][c] = backup;
          } else {
            removed++;
          }
        }

        return { solution: sol, puzzle: puz };
      }

      function buildUI() {
        boardEl.innerHTML = "";
        cellEls = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "cell";
            btn.dataset.row = r;
            btn.dataset.col = c;
            btn.setAttribute("role", "gridcell");
            btn.addEventListener("click", () => selectCell(r, c));
            boardEl.appendChild(btn);
            cellEls.push(btn);
          }
        }

        numpadEl.innerHTML = "";
        for (let n = 1; n <= 9; n++) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "num-btn";
          btn.textContent = String(n);
          btn.addEventListener("click", () => enterNumber(n));
          numpadEl.appendChild(btn);
        }
      }

      function cellAt(r, c) {
        return cellEls[r * SIZE + c];
      }

      function selectCell(r, c) {
        if (solved) return;
        selected = { r, c };
        refreshHighlights();
      }

      function enterNumber(n) {
        if (solved || !selected) return;
        const { r, c } = selected;
        if (puzzle[r][c] !== 0) return;
        grid[r][c] = n;
        renderCells();
        checkSolved();
      }

      function clearCell() {
        if (solved || !selected) return;
        const { r, c } = selected;
        if (puzzle[r][c] !== 0) return;
        grid[r][c] = 0;
        renderCells();
        setStatus("");
      }

      function conflictsFor(r, c, val) {
        if (!val) return false;
        for (let i = 0; i < SIZE; i++) {
          if (i !== c && grid[r][i] === val) return true;
          if (i !== r && grid[i][c] === val) return true;
        }
        const br = Math.floor(r / BOX) * BOX;
        const bc = Math.floor(c / BOX) * BOX;
        for (let rr = br; rr < br + BOX; rr++) {
          for (let cc = bc; cc < bc + BOX; cc++) {
            if ((rr !== r || cc !== c) && grid[rr][cc] === val) return true;
          }
        }
        return false;
      }

      function renderCells() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const el = cellAt(r, c);
            const val = grid[r][c];
            const isGiven = puzzle[r][c] !== 0;
            el.textContent = val ? String(val) : "";
            el.classList.toggle("given", isGiven);
            el.classList.toggle("conflict", conflictsFor(r, c, val));
            el.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}${val ? `, ${val}` : ", empty"}${isGiven ? ", given" : ""}`);
          }
        }
        refreshHighlights();
      }

      function refreshHighlights() {
        for (const el of cellEls) {
          el.classList.remove("selected", "related", "same-value");
        }
        if (!selected) return;
        const { r, c } = selected;
        const br = Math.floor(r / BOX) * BOX;
        const bc = Math.floor(c / BOX) * BOX;
        const val = grid[r][c];

        for (let i = 0; i < SIZE; i++) {
          cellAt(r, i).classList.add("related");
          cellAt(i, c).classList.add("related");
        }
        for (let rr = br; rr < br + BOX; rr++) {
          for (let cc = bc; cc < bc + BOX; cc++) {
            cellAt(rr, cc).classList.add("related");
          }
        }
        cellAt(r, c).classList.add("selected");
        cellAt(r, c).classList.remove("related");

        if (val) {
          for (let rr = 0; rr < SIZE; rr++) {
            for (let cc = 0; cc < SIZE; cc++) {
              if (grid[rr][cc] === val && (rr !== r || cc !== c)) {
                cellAt(rr, cc).classList.add("same-value");
              }
            }
          }
        }
      }

      function isCompleteAndValid() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const val = grid[r][c];
            if (!val || conflictsFor(r, c, val)) return false;
          }
        }
        return true;
      }

      function checkSolved() {
        if (!isCompleteAndValid()) {
          const hasConflict = cellEls.some((el) => el.classList.contains("conflict"));
          setStatus(hasConflict ? "Conflict — check highlighted cells." : "", hasConflict ? "warn" : "");
          return;
        }
        solved = true;
        boardEl.classList.add("solved");
        selected = null;
        refreshHighlights();
        setStatus("Solved! Nice work.", "win");
      }

      function setStatus(text, kind = "") {
        statusEl.textContent = text;
        statusEl.className = "status" + (kind ? ` ${kind}` : "");
      }

      function startNew() {
        setStatus("Generating…");
        boardEl.classList.remove("solved");
        solved = false;
        selected = null;

        // Yield so the status can paint before generation
        requestAnimationFrame(() => {
          setTimeout(() => {
            const result = generatePuzzle(difficulty);
            solution = result.solution;
            puzzle = result.puzzle;
            grid = cloneGrid(puzzle);
            renderCells();
            setStatus("");
            selectCell(0, 0);
            // Prefer first empty cell
            for (let r = 0; r < SIZE; r++) {
              for (let c = 0; c < SIZE; c++) {
                if (puzzle[r][c] === 0) {
                  selectCell(r, c);
                  return;
                }
              }
            }
          }, 10);
        });
      }

      function restart() {
        if (!puzzle.length) return;
        boardEl.classList.remove("solved");
        solved = false;
        grid = cloneGrid(puzzle);
        renderCells();
        setStatus("Puzzle restarted.");
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (puzzle[r][c] === 0) {
              selectCell(r, c);
              return;
            }
          }
        }
      }

      difficultyBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          difficulty = btn.dataset.diff;
          difficultyBtns.forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
          startNew();
        });
      });

      clearBtn.addEventListener("click", clearCell);
      restartBtn.addEventListener("click", restart);
      newBtn.addEventListener("click", startNew);

      document.addEventListener("keydown", (e) => {
        if (solved) {
          if (e.key === "n" || e.key === "N") startNew();
          return;
        }
        if (!selected) return;

        const { r, c } = selected;
        if (e.key >= "1" && e.key <= "9") {
          e.preventDefault();
          enterNumber(Number(e.key));
        } else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") {
          e.preventDefault();
          clearCell();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          selectCell(Math.max(0, r - 1), c);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          selectCell(Math.min(SIZE - 1, r + 1), c);
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          selectCell(r, Math.max(0, c - 1));
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          selectCell(r, Math.min(SIZE - 1, c + 1));
        }
      });

      buildUI();
      startNew();
    })();
  </script>
</body>
</html>
